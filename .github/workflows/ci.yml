name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".vscode/**"
      - ".devcontainer/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write
  statuses: write
  packages: write

jobs:
  golangci-lint:
    uses: actionsforge/actions-golangci-lint/.github/workflows/golangci-lint.yml@v0.0.10

  govulncheck:
    uses: actionsforge/actions-govulncheck/.github/workflows/govulncheck.yml@v0.0.10

  test:
    uses: actionsforge/actions-go-test/.github/workflows/go-test.yml@v0.0.8
    with:
      test-pattern: "./cmd/server"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ go.mod or go.sum has uncommitted changes"
            git diff
            exit 1
          fi
          echo "✅ go.mod is clean"

      - name: Build binary
        run: go build -v ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate container build
        run: |
          # Test that the container builds successfully
          docker build -t go-hello-service:test .
          echo "✅ Container builds successfully"

      - name: Validate container health check
        run: |
          # Test container health check
          docker run -d --name test-container go-hello-service:test
          sleep 10
          docker inspect test-container --format='{{.State.Health.Status}}'
          docker stop test-container
          docker rm test-container
          echo "✅ Container health check works"

      - name: Security scan
        run: |
          # Basic security checks
          echo "🔍 Checking for common security issues..."

          # Check for hardcoded secrets (basic check)
          if grep -r "password\|secret\|key\|token" cmd/ --exclude="*.go" 2>/dev/null; then
            echo "⚠️  Potential hardcoded secrets found"
          fi

          # Check for proper error handling
          if ! grep -r "if err != nil" cmd/; then
            echo "⚠️  Check error handling in code"
          fi

          echo "✅ Basic security checks completed"

      - name: Validation Summary
        run: |
          echo "🎉 All validations passed!"
          echo "✅ Go modules are clean"
          echo "✅ Binary builds successfully"
          echo "✅ Container builds successfully"
          echo "✅ Container health check works"
          echo "✅ Security checks completed"

  build-and-push:
    needs: [validate, golangci-lint, govulncheck, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: actionsforge/actions/.github/workflows/docker-image-publish.yml@main
    with:
      platforms: linux/amd64,linux/arm64
      scan-enabled: false

